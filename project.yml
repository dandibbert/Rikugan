name: Rikugan
options:
  bundleIdPrefix: com.dandibbert
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    RIKUGAN_GIT_COMMIT: "local"
    RIKUGAN_BUILD_DATE: "unknown"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
targets:
  Rikugan:
    type: application
    platform: iOS
    sources:
      - path: Sources/Rikugan
        excludes:
          - "Resources/**"
          - "Info.plist"
          - "Rikugan.entitlements"
      - path: Sources/Rikugan/Resources/JS
        buildPhase: resources
      - path: Sources/Rikugan/Resources/Filters
        buildPhase: resources
      - path: Sources/Rikugan/Resources/SelfTest
        type: folder
        buildPhase: resources
      - path: Sources/Rikugan/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dandibbert.Rikugan
        INFOPLIST_FILE: Sources/Rikugan/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Alternate icons selectable in Settings → 外观与工具栏 → App 图标.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconOrbit AppIconNova
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # App Group shared with the share extension. The CI IPA is unsigned; whoever signs it must
        # keep this group (and the extension's) or the share hand-off falls back to the clipboard.
        CODE_SIGN_ENTITLEMENTS: Sources/Rikugan/Rikugan.entitlements
    dependencies:
      - target: RikuganShare
        embed: true
      - sdk: WebKit.framework
  RikuganShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ShareExtension
        excludes: ["Info.plist", "RikuganShare.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dandibbert.Rikugan.Share
        INFOPLIST_FILE: Sources/ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ShareExtension/RikuganShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  RikuganUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dandibbert.Rikugan.UITests
    dependencies:
      - target: Rikugan
schemes:
  Rikugan:
    build:
      targets:
        Rikugan: all
        RikuganShare: all
    test:
      targets: [RikuganUITests]
