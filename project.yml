name: Rikugan
options:
  bundleIdPrefix: com.dandibbert
  deploymentTarget:
    iOS: "18.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  Rikugan:
    type: application
    platform: iOS
    sources:
      - path: Rikugan
        excludes: [Resources, Info.plist, Rikugan.entitlements]
      - path: Rikugan/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dandibbert.Rikugan
        INFOPLIST_FILE: Rikugan/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Rikugan/Rikugan.entitlements
    dependencies:
      - target: RikuganShare
        embed: true
        codeSign: false
        link: false
      - sdk: WebKit.framework
      - sdk: JavaScriptCore.framework
  RikuganShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: [Info.plist, RikuganShare.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dandibbert.Rikugan.Share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/RikuganShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  RikuganTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rikugan
  RikuganUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rikugan
schemes:
  Rikugan:
    build:
      targets:
        Rikugan: all
        RikuganShare: all
    test:
      debugEnabled: false
      targets: [RikuganTests, RikuganUITests]

