name: Rikugan
options:
  bundleIdPrefix: com.dandibbert
  deploymentTarget:
    iOS: "18.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  Rikugan:
    type: application
    platform: iOS
    sources:
      - path: Rikugan
        excludes: [Resources, Info.plist]
      - path: Rikugan/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dandibbert.Rikugan
        INFOPLIST_FILE: Rikugan/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - sdk: WebKit.framework
      - sdk: JavaScriptCore.framework
  RikuganTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rikugan
  RikuganUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rikugan
schemes:
  Rikugan:
    build:
      targets:
        Rikugan: all
    test:
      targets: [RikuganTests, RikuganUITests]

