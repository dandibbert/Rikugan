<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lifecycle</title>
<style>body { margin: 0; font: 16px sans-serif; } .tall { height: 5000px; background: linear-gradient(#fff, #ccd); }</style></head>
<body><h1 id="title">page</h1><div id="tall"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('title').textContent = 'page ' + (q.get('n') || '');
  document.title = 'L' + (q.get('n') || '');
  if (q.has('tall')) document.getElementById('tall').className = 'tall';
  window.__loadedAt = Date.now();
</script></body></html>
