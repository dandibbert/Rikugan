<!doctype html>
<html><head><meta charset="utf-8"><title>DNR media</title></head>
<body>
<p>Media sniffer with DNR rules active: an allowed HLS playlist (fetch), an allowed MP4 (XHR) and a
DNR-blocked playlist (fetch). Only media whose response actually arrived may be listed.</p>
<script>
(async () => {
  const out = {};
  try { const r = await fetch('/dnr/dl/stream.m3u8'); out.hls = r.status + ':' + (await r.text()).length; } catch (e) { out.hls = 'error'; }
  out.mp4 = await new Promise((resolve) => {
    const x = new XMLHttpRequest();
    x.open('GET', '/dnr/dl/clip.mp4');
    x.onload = () => resolve(x.status + ':' + (x.response ? x.response.length : 0));
    x.onerror = () => resolve('error');
    x.send();
  });
  try { const r = await fetch('/dnr/block-hls.m3u8'); out.blocked = 'loaded:' + r.status; } catch (e) { out.blocked = 'blocked'; }
  document.documentElement.setAttribute('data-media-result', JSON.stringify(out));
  document.documentElement.setAttribute('data-media-done', '1');
})();
</script>
</body></html>
