name: Run one simulator self-test suite
description: Runs an in-app self-test suite from prebuilt simulator products and publishes its report.
inputs:
  suite:
    description: Suite name (core, pageworld, fonts, dnr, lifecycle, stress, archive, compat)
    required: true
  test:
    description: XCUITest method in RikuganUITests/BrowserUITests
    required: true
  stress-rounds:
    description: Rounds for the background stress suite
    default: "30"
  compat-dir:
    description: Directory with real extension packages + sources.json to place into the app bundle
    default: ""
  min-checks:
    description: Minimum number of checks a complete run of this suite records (truncated runs fail)
    required: true
  allow-fail:
    description: "true for report-only suites: a finished FAIL result is acceptable, an unfinished or stale one is not"
    default: "false"
runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      run: |
        XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
        sudo xcode-select -s "$XCODE/Contents/Developer"
    - uses: actions/download-artifact@v4
      with:
        name: sim-products
    - name: Unpack products
      shell: bash
      run: |
        mkdir -p build/Build
        tar -C build/Build -xzf sim-products.tgz
        if [ -n "${{ inputs.compat-dir }}" ]; then
          APP=$(ls -d build/Build/Products/Debug-iphonesimulator/Rikugan.app)
          mkdir -p "$APP/SelfTest/compat"
          cp -R "${{ inputs.compat-dir }}"/. "$APP/SelfTest/compat/"
          ls -la "$APP/SelfTest/compat"
        fi
    - name: Create run nonce
      shell: bash
      run: |
        echo "RIKUGAN_RUN_ID=ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.suite }}-$(uuidgen)" >> "$GITHUB_ENV"
        echo "RIKUGAN_NOT_BEFORE=$(date +%s)" >> "$GITHUB_ENV"
    - name: Run suite ${{ inputs.suite }}
      shell: bash
      env:
        TEST_RUNNER_RIKUGAN_STRESS_ROUNDS: ${{ inputs.stress-rounds }}
        TEST_RUNNER_RIKUGAN_RUN_ID: ${{ env.RIKUGAN_RUN_ID }}
      run: |
        set -o pipefail
        echo "run nonce: $RIKUGAN_RUN_ID"
        SIM=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
        echo "SIM=$SIM" >> "$GITHUB_ENV"
        xcrun simctl boot "$SIM" || true
        xcrun simctl bootstatus "$SIM" -b
        XCTESTRUN=$(ls build/Build/Products/*.xctestrun | head -1)
        xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "platform=iOS Simulator,id=$SIM" \
          -only-testing:RikuganUITests/BrowserUITests/${{ inputs.test }} -resultBundlePath "SelfTest-${{ inputs.suite }}.xcresult" \
          2>&1 | tee "selftest-${{ inputs.suite }}.log" | grep -E "error:|Test Case|SELFTEST|\*\*" || true
        grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*\|\*\* TEST SUCCEEDED \*\*" "selftest-${{ inputs.suite }}.log"
    - name: Collect report
      if: always()
      shell: bash
      run: |
        mkdir -p reports
        DATA=$(xcrun simctl get_app_container "$SIM" com.dandibbert.Rikugan data 2>/dev/null || true)
        if [ -n "$DATA" ] && [ -d "$DATA/Documents/SelfTestReports" ]; then cp "$DATA"/Documents/SelfTestReports/*.json reports/ || true; fi
        ls reports
        python3 scripts/selftest_report.py reports >> "$GITHUB_STEP_SUMMARY" || true
        python3 scripts/selftest_report.py reports | head -400 || true
    - name: Verify the app-side result belongs to this run
      shell: bash
      run: |
        EXTRA=""
        if [ "${{ inputs.allow-fail }}" = "true" ]; then EXTRA="--allow-fail"; fi
        python3 scripts/verify_selftest_result.py "reports/${{ inputs.suite }}.json" --run-id "$RIKUGAN_RUN_ID" \
          --suite "${{ inputs.suite }}" --not-before "$RIKUGAN_NOT_BEFORE" --min-checks "${{ inputs.min-checks }}" $EXTRA
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: selftest-${{ inputs.suite }}
        path: |
          reports
          SelfTest-${{ inputs.suite }}.xcresult
          selftest-${{ inputs.suite }}.log
        retention-days: 14
