name: Build and test iOS
on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rikugan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer; fi
          xcodebuild -version
          xcodebuild -showsdks
      - name: Prepare project and resources
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 scripts/prepare_resources.py
          node scripts/test_runtime.cjs
          node scripts/test_page_tools.cjs
          xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project Rikugan.xcodeproj -scheme Rikugan -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} ARCHS=arm64 build | tee build-device.log
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/Rikugan.app dist/Payload/
          rm -rf dist/Payload/Rikugan.app/_CodeSignature
          find dist/Payload -name embedded.mobileprovision -delete
          file dist/Payload/Rikugan.app/Rikugan
          cd dist
          zip -qry Rikugan-0.2.0-unsigned.ipa Payload
          rm -rf Payload
          shasum -a 256 *.ipa > SHA256SUMS.txt
      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rikugan-unsigned-IPA
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Test core, extension runtime and profile isolation
        run: |
          set -o pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory Tests/Fixtures > /tmp/rikugan-fixture.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" || true' EXIT
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for k in sorted(d["devices"], reverse=True) if "iOS" in k for x in d["devices"][k] if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test -project Rikugan.xcodeproj -scheme Rikugan -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build \
            -resultBundlePath TestResults.xcresult -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} | tee test.log
      - name: Publish tested prerelease
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.2.0-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.ipa dist/SHA256SUMS.txt \
            --title "Rikugan 0.2.0 · build ${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" --prerelease --notes-file docs/RELEASE_NOTES.md
      - name: Upload test evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rikugan-test-evidence
          path: |
            TestResults.xcresult
            build-device.log
            test.log
          retention-days: 30

