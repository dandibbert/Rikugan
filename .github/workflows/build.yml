name: Build and test iOS
on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rikugan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer; fi
          xcodebuild -version
          xcodebuild -showsdks
      - name: Prepare project and resources
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 scripts/prepare_resources.py
          node scripts/test_runtime.cjs
          node scripts/test_storage_events.cjs
          node scripts/test_xhr.cjs
          node scripts/test_page_tools.cjs
          node scripts/test_web_fonts.cjs
          python3 scripts/test_fixture_server.py
          python3 scripts/validate_project.py
          xcodegen generate
          SIMULATOR_ID=$(python3 scripts/select_simulator.py)
          echo "TEST_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          # Boot concurrently with the device compilation instead of blocking later.
          xcrun simctl boot "$SIMULATOR_ID" || true
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project Rikugan.xcodeproj -scheme Rikugan -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} ARCHS=arm64 build | tee build-device.log
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/Rikugan.app dist/Payload/
          rm -rf dist/Payload/Rikugan.app/_CodeSignature
          find dist/Payload -name embedded.mobileprovision -delete
          file dist/Payload/Rikugan.app/Rikugan
          cd dist
          zip -qry Rikugan-0.4.0-unsigned.ipa Payload
          rm -rf Payload
          shasum -a 256 *.ipa > SHA256SUMS.txt
      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rikugan-unsigned-IPA
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Test core, extension runtime and profile isolation
        id: tests
        timeout-minutes: 18
        run: |
          set -o pipefail
          python3 scripts/fixture_server.py > /tmp/rikugan-fixture.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" || true' EXIT
          SIMULATOR_ID="$TEST_SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test -project Rikugan.xcodeproj -scheme Rikugan -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build \
            -resultBundlePath TestResults.xcresult -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 360 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES \
            CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} | tee test.log
      - name: Upload immediate build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rikugan-build-logs
          path: |
            build-device.log
            test.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Collect WebKit runtime diagnostics
        if: always()
        run: |
          if [ -n "${TEST_SIMULATOR_ID:-}" ]; then
            xcrun simctl spawn "$TEST_SIMULATOR_ID" log show --style compact --last 20m \
              --predicate 'process == "Rikugan" OR subsystem == "com.apple.WebKit"' > webkit-runtime.log 2>&1 || true
          fi
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export diagnostics --path TestResults.xcresult --output-path TestDiagnostics || true
          fi
      - name: Package reproducible test evidence
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: python3 scripts/package_test_evidence.py
      - name: Upload test bundle and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rikugan-test-bundle
          path: |
            dist/tests.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish tested prerelease
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.4.0-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.ipa dist/tests.zip dist/SHA256SUMS.txt \
            --title "Rikugan 0.4.0 · build ${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" --prerelease --notes-file docs/RELEASE_NOTES.md
      - name: Export test screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestScreenshots || true
          fi
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rikugan-screenshots
          path: TestScreenshots/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload test evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rikugan-test-evidence
          path: |
            TestResults.xcresult
            build-device.log
            test.log
            webkit-runtime.log
            TestDiagnostics/
          retention-days: 30

