name: Build unsigned IPA
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rikugan-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_VERSION: "1.0.0"

jobs:
  core-tests:
    name: Core unit tests + JS runtime tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Swift package tests (URL matcher, metadata, manifests, filters, DNR, ZIP/CRX)
        run: swift test 2>&1 | tee core-tests.log
      - name: JavaScript runtime tests (GM API, chrome.* shim, page tools)
        run: node scripts/test_js.cjs
      - name: Self-test result verifier rejects stale / fake results
        run: python3 scripts/test_verify_selftest.py
      - name: Chrome API matrix document is generated from the verified JSON
        run: python3 scripts/gen_api_matrix.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-log
          path: core-tests.log
          retention-days: 14

  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build for device (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild -project Rikugan.xcodeproj -scheme Rikugan -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} RIKUGAN_GIT_COMMIT=${GITHUB_SHA::12} \
            RIKUGAN_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%MZ) build 2>&1 | tee build.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
          test -f build/Build/Products/Release-iphoneos/Rikugan.app/Rikugan
      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -150 || true
      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/Rikugan.app dist/Payload/
          find dist/Payload -name _CodeSignature -type d -exec rm -rf {} +
          find dist/Payload -name embedded.mobileprovision -delete
          ls dist/Payload/Rikugan.app/PlugIns
          file dist/Payload/Rikugan.app/Rikugan
          cd dist
          zip -qry "Rikugan-${APP_VERSION}-build${GITHUB_RUN_NUMBER}-unsigned.ipa" Payload
          rm -rf Payload
          shasum -a 256 *.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Rikugan-unsigned-ipa
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 14

  sim-build:
    name: Build for simulator tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build for testing (iOS Simulator, Debug)
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Rikugan.xcodeproj -scheme Rikugan -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            RIKUGAN_GIT_COMMIT=${GITHUB_SHA::12} RIKUGAN_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%MZ) 2>&1 | tee build-sim.log | grep -E "error:|\*\*" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build-sim.log
          ls build/Build/Products/*.xctestrun
          tar -C build/Build -czf sim-products.tgz Products
      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" build-sim.log | sort -u | head -150 || true
      - uses: actions/upload-artifact@v4
        with:
          name: sim-products
          path: sim-products.tgz
          retention-days: 3

  simtests:
    name: "Simulator: ${{ matrix.suite }}"
    needs: sim-build
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: core, test: testSelfTestSuitePasses, min: 28 }
          - { suite: pageworld, test: testPageWorldSuite, min: 40 }
          - { suite: security, test: testSecuritySuite, min: 48 }
          - { suite: fonts, test: testFontSuite, min: 18 }
          - { suite: dnr, test: testDNRSuite, min: 26 }
          - { suite: lifecycle, test: testTabLifecycleSuite, min: 22 }
          - { suite: stress, test: testBackgroundStressSuite, min: 33 }
          - { suite: archive, test: testArchiveRoundTripSuite, min: 14 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sim-test
        with:
          suite: ${{ matrix.suite }}
          test: ${{ matrix.test }}
          stress-rounds: "30"
          min-checks: ${{ matrix.min }}

  compat:
    name: "Simulator: real extension compatibility (report)"
    needs: sim-build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download real extensions (failures are recorded, not fatal)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_compat_extensions.py compat-packages
      - uses: ./.github/actions/sim-test
        with:
          suite: compat
          test: testRealExtensionCompatReport
          compat-dir: compat-packages
          min-checks: "3"
          allow-fail: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-sources
          path: |
            compat-packages/sources.json
            compat-packages/violentmonkey-mv3-probe.json
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish prerelease
    needs: [core-tests, ipa, simtests, compat]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Rikugan-unsigned-ipa
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: selftest-compat
          path: compat-artifact
      - uses: actions/download-artifact@v4
        with:
          name: compat-sources
          path: compat-artifact/sources
      - name: Compatibility report, build metadata, instructions
        run: |
          TAG="v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}"
          REPORT=$(find compat-artifact -name compat.json | head -1)
          {
            echo "# Rikugan ${TAG} — real extension compatibility (iOS Simulator, CI)"
            echo
            echo "Commit \`${GITHUB_SHA}\` · run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "These are simulator observations, not device results. See docs/COMPATIBILITY.md for the interpretation."
            echo
            python3 scripts/selftest_report.py "$(dirname "$REPORT")"
            if [ -f compat-artifact/sources/violentmonkey-mv3-probe.json ]; then
              echo; echo "## Violentmonkey MV3 availability probe"; echo; echo '```json'
              cat compat-artifact/sources/violentmonkey-mv3-probe.json; echo '```'
            fi
          } > dist/compatibility-report.md
          cp docs/MANUAL_TESTING.md dist/MANUAL_TESTING.md
          python3 - <<PY
          import json, os, hashlib
          ipa = [f for f in os.listdir("dist") if f.endswith(".ipa")][0]
          meta = {
              "app": "Rikugan", "version": os.environ["APP_VERSION"], "build": int(os.environ["GITHUB_RUN_NUMBER"]),
              "tag": "${TAG}", "commit": os.environ["GITHUB_SHA"], "commitShort": os.environ["GITHUB_SHA"][:12],
              "branch": os.environ["GITHUB_REF_NAME"],
              "run": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "ipa": ipa, "ipaSha256": hashlib.sha256(open(f"dist/{ipa}", "rb").read()).hexdigest(),
              "signed": False,
              "ciResults": "Swift/JS unit tests, verifier tests and simulator suites core, pageworld, security, fonts, dnr, lifecycle, stress, archive passed in this run (simulator only; each result verified against a per-run nonce).",
              "installedCommitCheck": "Settings → bottom line shows 'commit <12 chars>'; must equal commitShort.",
          }
          json.dump(meta, open("dist/build-metadata.json", "w"), indent=2)
          PY
          cat dist/build-metadata.json
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.ipa dist/SHA256SUMS.txt dist/build-metadata.json dist/compatibility-report.md dist/MANUAL_TESTING.md \
            --title "Rikugan ${APP_VERSION} (build ${GITHUB_RUN_NUMBER}, ${GITHUB_REF_NAME})" \
            --target "$GITHUB_SHA" --prerelease --notes-file docs/RELEASE_NOTES.md
